openapi: 3.2.0
info:
  title: Emem Dev Boring API
  version: 2.4.0
  license:
    name: Apache-2.0
  x-emem-surface-asymmetry:
    memory_notes: MCP only
    reach_them_at: POST /mcp, method tools/call
    read_side_is_here:
    - /v1/memory/search
    - /v1/memory/sse
    - /memories/{path}
    tools:
    - emem_memory_create
    - emem_memory_view
    - emem_memory_delete
    - emem_memory_rename
    - emem_memory_str_replace
    - emem_memory_supersede
    why_not_here: These write the agent correspondence plane, which is prose and untrusted-by-declaration. It is deliberately not part of the REST fact surface, and the two planes are kept apart rather than merged for convenience.
  description: 'Operations tagged boring across 2 of this provider''s published API definitions: emem-dev-openapi-original.json, emem-dev-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- description: Hosted instance (HTTPS-only)
  url: https://emem.dev
tags:
- name: boring
paths:
  /v1/agent_quickref:
    get:
      description: 'agent-targeted intent map: which endpoint to call for which user intent, with usage priority + trust language'
      operationId: emem_agent_quickref
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ok
      summary: 'agent-targeted intent map: which endpoint to call for which user intent, with…'
      tags:
      - boring
    servers:
    - description: Hosted instance (HTTPS-only)
      url: https://emem.dev
  /v1/air:
    get:
      description: 'Recall the signed Copernicus CAMS air-quality facts (PM2.5 + NO2 + O3) at a place''s cell64, attesting on a miss. Composes locate → recall → aggregate; each band carries a citeable fact_cid.


        When to use: Use when the user names a place and asks about air quality, pollution, or emissions exposure. CAMS is the European reanalysis, global coverage, ~0.4° native (resampled). For finer-grained urban PM2.5, pair with /v1/at-style stations data when available.'
      operationId: emem_air_get
      parameters:
      - in: query
        name: lat
        required: false
        schema:
          type: number
      - in: query
        name: lon
        required: false
        schema:
          type: number
      - in: query
        name: place
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedResponse'
          description: ok
      summary: GET /v1/air?lat=&lon=, CAMS PM2.5 + NO2 + O3 + aerosol optical depth at 550 nm…
      tags:
      - boring
    post:
      description: 'Recall the signed Copernicus CAMS air-quality facts (PM2.5 + NO2 + O3) at a place''s cell64, attesting on a miss. Composes locate → recall → aggregate; each band carries a citeable fact_cid.


        When to use: Use when the user names a place and asks about air quality, pollution, or emissions exposure. CAMS is the European reanalysis, global coverage, ~0.4° native (resampled). For finer-grained urban PM2.5, pair with /v1/at-style stations data when available.'
      operationId: emem_air_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoringPostReq'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedResponse'
          description: ok
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'error, the emem.error.v1 envelope. Branch on the stable `code` (see GET /v1/errors), not the message. A malformed or missing-field request body returns `code: invalid_argument` with the offending field named in `message`.'
      summary: POST /v1/air {place|lat,lng}
      tags:
      - boring
    servers:
    - description: Hosted instance (HTTPS-only)
      url: https://emem.dev
  /v1/at:
    get:
      description: 'One-shot recall of the signed facts at a place''s cell64 (or lat/lng); each band carries a citeable fact_cid. Defaults to emem''s standard at-a-glance band set; pass `band` / `bands` to override. Polygon-resolved places stay at the centroid by default (`n_cells: 1`) to keep multi-band calls cheap; pass `n_cells: 2..=64` to fan out.


        When to use: Use when the user names a place and wants the standard situational readout (vegetation + elevation + landcover + recent weather) without picking bands. Polygon-aware: `place` that resolves to a polygon (park, lake, district) lands at the centroid unless `n_cells` widens it. For a single band, use the domain-specific shortcuts (emem_ndvi, emem_air, …) or emem_recall directly.'
      operationId: emem_at_get
      parameters:
      - in: query
        name: lat
        required: false
        schema:
          type: number
      - in: query
        name: lon
        required: false
        schema:
          type: number
      - in: query
        name: place
        required: false
        schema:
          type: string
      - in: query
        name: band
        required: false
        schema:
          description: e.g. indices.ndvi, soilgrids.soc_0_30cm, weather.temperature_2m
          type: string
      - in: query
        name: bands
        required: false
        schema:
          description: CSV of bands, applied alongside `band`
          type: string
      - in: query
        name: tslot
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedResponse'
          description: ok
      summary: GET /v1/at?lat=&lon=&band=, boring lat/lng lookup of any of the 101…
      tags:
      - boring
    post:
      description: 'One-shot recall of the signed facts at a place''s cell64 (or lat/lng); each band carries a citeable fact_cid. Defaults to emem''s standard at-a-glance band set; pass `band` / `bands` to override. Polygon-resolved places stay at the centroid by default (`n_cells: 1`) to keep multi-band calls cheap; pass `n_cells: 2..=64` to fan out.


        When to use: Use when the user names a place and wants the standard situational readout (vegetation + elevation + landcover + recent weather) without picking bands. Polygon-aware: `place` that resolves to a polygon (park, lake, district) lands at the centroid unless `n_cells` widens it. For a single band, use the domain-specific shortcuts (emem_ndvi, emem_air, …) or emem_recall directly.'
      operationId: emem_at_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoringPostReq'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedResponse'
          description: ok
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'error, the emem.error.v1 envelope. Branch on the stable `code` (see GET /v1/errors), not the message. A malformed or missing-field request body returns `code: invalid_argument` with the offending field named in `message`.'
      summary: POST /v1/at {place|lat,lng[,band|bands,tslot]} → multi-band at a point
      tags:
      - boring
    servers:
    - description: Hosted instance (HTTPS-only)
      url: https://emem.dev
  /v1/elevation:
    get:
      description: 'One-shot elevation answer that fuses Cop-DEM 30 m (land), GMRT (ocean topobathy), and ESA WorldCover (water mask) into a single signed scalar at a place or coordinate. Returns `elevation_m`, the source actually used, and a `coherence_note` when the two surfaces disagree at the coast.


        When to use: Use when the user asks ''how high is X'' or ''what''s the elevation at this lat/lng'' and you want the correct answer regardless of whether the cell is land, water, or coastline, the handler picks Cop-DEM for land and GMRT for water and surfaces the choice. Pass `place` (free text), `lat`+`lng`, OR `cell`. Otherwise, prefer emem_recall with `copdem30m.elevation_mean` / `gmrt.topobathy_mean` individually.'
      operationId: emem_elevation_get
      parameters:
      - in: query
        name: lat
        required: false
        schema:
          type: number
      - in: query
        name: lon
        required: false
        schema:
          type: number
      - in: query
        name: place
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedResponse'
          description: ok
      summary: GET /v1/elevation?lat=&lon=, boring lat/lng lookup, returns Cop-DEM elevation…
      tags:
      - boring
    post:
      description: 'One-shot elevation answer that fuses Cop-DEM 30 m (land), GMRT (ocean topobathy), and ESA WorldCover (water mask) into a single signed scalar at a place or coordinate. Returns `elevation_m`, the source actually used, and a `coherence_note` when the two surfaces disagree at the coast.


        When to use: Use when the user asks ''how high is X'' or ''what''s the elevation at this lat/lng'' and you want the correct answer regardless of whether the cell is land, water, or coastline, the handler picks Cop-DEM for land and GMRT for water and surfaces the choice. Pass `place` (free text), `lat`+`lng`, OR `cell`. Otherwise, prefer emem_recall with `copdem30m.elevation_mean` / `gmrt.topobathy_mean` individually.'
      operationId: emem_elevation
      requestBody:
