codes:
- code: invalid_cell
  mcp_error_code: -27
  meaning: cell64 string did not parse
  recover: Re-encode (lat,lng) via POST /v1/locate, or check the bigram boundaries (must be exactly four base-65,536
    bigrams joined by '.').
- code: invalid_resolution
  mcp_error_code: -1
  meaning: resolution bits out of range
  recover: Use the cell64 returned by /v1/locate; that's always at the active resolution. See /v1/grid_info.
- code: tslot_mismatch
  mcp_error_code: -2
  meaning: tslot in request doesn't match band's expected tempo
  recover: Check /v1/bands for the band's `tempo` field and round your tslot to that grid.
- code: band_not_in_registry
  mcp_error_code: -3
  meaning: band key isn't in the active manifest
  recover: 'GET /v1/bands for the canonical list. Common typos: missing schema namespace (need `copdem30m.elevation_mean`,
    not `elevation_mean`).'
- code: function_not_in_registry
  mcp_error_code: -4
  meaning: derivation fn_key not registered
  recover: Functions ship via /v1/functions. To use a private function, register it in your registry_cid before
    attesting.
- code: source_scheme_unknown
  mcp_error_code: -5
  meaning: source.scheme not in /v1/sources
  recover: GET /v1/sources for the active connector list. Self-hosters can add via the source manifest.
- code: cid_not_found
  mcp_error_code: -6
  meaning: fact CID exists but no matching object on disk
  recover: The fact may have been pruned, or the CID is from a different responder. Verify `responder_pubkey_b32`
    matches between the receipt and /health.
- code: no_geocoder_match
  mcp_error_code: -7
  meaning: every geocoder tier answered and none of them knows this place (embedded gazetteer, cache, Photon, Nominatim).
    The transports worked; the name is genuinely not there. HTTP 404.
  recover: 'Refine the query: add country / region disambiguation (''Springfield, IL, USA''), use the official local-language
    spelling, or pass `lat`+`lng` directly. POST /v1/locate surfaces `via`, so you can see which tier answered.
    Retrying an unchanged query will not help.'
- code: invalid_argument
  mcp_error_code: -25
  meaning: syntactically valid but semantically invalid request field (e.g. unparseable timestamp, out-of-range
    numeric, malformed enum)
  recover: 'Re-read /openapi.json for the field''s accepted shape. Common causes: ISO 8601 missing ''Z'' for UTC;
    max_cells > 1024; band key with wrong namespace prefix.'
- code: registry_cid_unknown
  mcp_error_code: -8
  meaning: the bound registry_cid isn't recognised
  recover: Receipts pin manifest CIDs at issue time; if the responder rotated manifests, check /v1/manifests for
    the current `registry_cid`.
- code: schema_cid_unknown
  mcp_error_code: -9
  meaning: fact's schema_cid isn't loaded
  recover: GET /v1/manifests for the current `schema_cid`. Re-attest with the active schema, or pin the older manifest
    if the responder still has it.
- code: privacy_refused
  mcp_error_code: -10
  meaning: band's privacy_class blocks this query at the requested resolution
  recover: Drop the resolution (snap to a coarser cell) or request via an authorised attester. Check /v1/bands for
    `privacy_class`.
- code: level_too_low
  mcp_error_code: -11
  meaning: operation requires a higher protocol level (L1/L2)
  recover: L0/L1 are anonymous; L2 (write/challenge) requires an attester key. Generate ed25519, post to /v1/attest_cbor.
- code: attester_revoked
  mcp_error_code: -12
  meaning: the attester pubkey is in the revocation set
  recover: Check /v1/contributors for `revoked` flag. Submit a fresh keypair if revoked legitimately, or contest
    via /v1/challenge.
- code: unauthorized
  mcp_error_code: -13
  meaning: missing or invalid attester signature on a write
  recover: Re-sign with the same keypair that issued the registered attester pubkey; signature must be over blake3(batch_root
    || registry_cid || schema_cid).
- code: claim_undecidable
  mcp_error_code: -14
  meaning: verify input doesn't yield true/false (e.g. NaN, type mismatch)
  recover: Inspect the fact via /v1/recall, the value may be missing, the wrong type, or NaN. Tighten your claim
    or pre-filter before /v1/verify.
- code: bad_signature
  mcp_error_code: -15
  meaning: ed25519 signature failed to verify
  recover: Re-sign with the correct preimage. /v1/verify_receipt's response includes `preimage_blake3_hex` so you
    can debug locally.
- code: unaddressable_subject
  mcp_error_code: -16
  meaning: a fact's subject belongs to no address space, so the write is refused before the log
  recover: 'The subject must be a cell64 (four dot-separated alphabet symbols) or an emem:entity: identity. Your
    signature is NOT the problem: this used to surface as bad_signature and sent debuggers at their keys. The log
    is append-only, so a fact at a subject nothing resolves could never be recalled or dereferenced, which is why
    it is refused rather than stored.'
- code: bad_merkle_proof
  mcp_error_code: -17
  meaning: Merkle inclusion proof is malformed or doesn't reach the batch_root
  recover: Re-build the proof from the canonical-sorted leaf list; verify `leaf_index` is correct.
- code: canonical_encoding_divergence
  mcp_error_code: -18
  meaning: CBOR you sent isn't deterministic per RFC 8949 §4.2.1
  recover: Use a CBOR library with `canonical=true`; serde-derived structs are usually fine, freeform maps must
    have sorted keys.
- code: source_fetch_failed
  mcp_error_code: -19
  meaning: 'an upstream fetch failed at the transport layer (non-2xx, DNS, timeout, malformed JSON) before any verdict
    could be reached. On a PLACE lookup this is the geocoder being down rather than the place being absent, which
    is `no_geocoder_match`: 502 against 404, retry against refine.'
  recover: Retry with backoff; check /v1/sources to confirm the URL template still resolves. May indicate provider-side
    outage. For a place lookup, pass `lat`+`lng` directly to skip the geocoder.
- code: source_format_mismatch
  mcp_error_code: -20
  meaning: fetched bytes don't match the declared scheme (e.g. GeoTIFF magic missing)
  recover: Re-fetch with explicit content-type. Could indicate provider migrated to a new format; consult their
    docs.
- code: compute_timeout
  mcp_error_code: -21
  meaning: derivation function exceeded EMEM_TIMEOUT_SECS
  recover: Submit smaller inputs, or run the computation client-side and attest the derivative directly.
- code: compute_quota_exceeded
  mcp_error_code: -22
  meaning: function call hit per-attester quota
  recover: Throttle and retry inside the window published at /v1/limits; the quota is per key and per day.
- code: rate_limited
  mcp_error_code: -23
  meaning: per-IP rate limit hit
  recover: Backoff per the `Retry-After` header, which this responder sets to 1. The bucket refills continuously
    (600 req/min sustained, 120 burst), so a short sleep is the right response, not a minute. Operators tune via
    EMEM_RATE_LIMIT_RPS / EMEM_RATE_LIMIT_BURST.
- code: cache_error
  mcp_error_code: -24
  meaning: responder's hot cache (sled) had an internal error
  recover: Retry; if persistent, the responder's storage may need recovery, operators see the cause in the journald
    log.
- code: internal
  mcp_error_code: -26
  meaning: responder-side bug
  recover: Capture the response and the request that produced it; file at https://github.com/Vortx-AI/emem/issues.
