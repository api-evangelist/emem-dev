standards:
- id: openapi-3.1
  conforms: true
  evidence: openapi/emem-dev-openapi.json declares openapi 3.1.0 with 178 paths / 196 operations, every operation carrying an operationId; served at https://emem.dev/openapi.json (200, application/json).
- id: json-schema-2020-12
  conforms: true
  evidence: GET /v1/schemas serves each request/response body as a self-contained draft 2020-12 JSON Schema (emem.dev/v1/schemas "_means"); /v1/schemas/eudr_dds.json is one of them.
- id: mcp
  conforms: true
  evidence: POST https://emem.dev/mcp answered initialize (2026-09-19) advertising protocol versions 2024-11-05, 2025-03-26, 2025-06-18 and 2025-11-25; tools/list returned 110 tools with inputSchema, MCP annotations (readOnlyHint / destructiveHint / idempotentHint / openWorldHint) and _meta; /.well-known/mcp.json uses the modelcontextprotocol.io well-known-mcp draft schema.
- id: a2a-1.0
