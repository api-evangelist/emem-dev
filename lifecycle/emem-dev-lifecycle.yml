versioning:
  scheme: semver (server 2.4.0; wire protocol spec.md v1.2.1; receipt preimage versions v0/v1/v2)
  mechanism: >-
    The hosted responder runs the tip of main and self-reports its commit in the x-emem-commit
    response header and the signed operator_attestation in /.well-known/emem.json (version, git_commit,
    build_timestamp, binary_blake3). REST paths are versioned by prefix (/v1/*) and declared wire-stable;
    MCP protocol version is negotiated on initialize (2024-11-05 through 2025-11-25) and echoed in the
    mcp-protocol-version header. Registries that produce facts are pinned by content-addressed manifest
    CIDs (bands_cid, algorithms_cid, sources_cid, schema_cid ...) served at /v1/manifests and /health.
  current: 2.4.0
  current_released: '2026-09-09'
  docs: https://emem.dev/docs/operators/deprecations.html
  changelog: changelog/emem-dev-changelog.yml
  notes: >-
    Receipts carry preimage_version; a verifier selects the rule from that field. 2.0.0 (2026-08-05)
    changed the receipt preimage (v2 binds the inclusion proof) and was shipped as a major for that
    reason; v0 and v1 receipts remain valid under their own rules.
