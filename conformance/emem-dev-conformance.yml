- id: rfc8949-cbor-canonical
  conforms: true
  evidence: Facts are content-addressed over canonical CBOR; error code canonical_encoding_divergence ("CBOR you sent isn't deterministic per RFC 8949 section 4.2.1") in /v1/errors; POST /v1/attest_cbor in the OpenAPI.
