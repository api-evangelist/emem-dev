apis:
- name: emem MCP Server
  description: >-
    Remote MCP server (JSON-RPC 2.0 over Streamable HTTP) at https://emem.dev/mcp exposing 110 tools;
    /mcp lists an 18-tool core loop and /mcp/full the complete set. No authentication to read; every tool
    carries MCP annotations and dev.emem/* metadata.
  image: https://emem.dev/logo.png
  humanURL: https://emem.dev/tools
  baseURL: https://emem.dev/mcp
  tags:
  - MCP
  - AI Agents
  - Agent Memory
  properties:
  - type: MCPServer
    url: mcp/emem-dev-mcp.yml
  - type: ToolCrosswalk
    url: mcp/emem-dev-tool-crosswalk.yml
  - type: Documentation
    url: https://emem.dev/integrations.md
- name: emem A2A Agent
  description: >-
    Agent-to-agent surface: synchronous JSON-RPC message/send at POST /a2a/tasks, an async task extension
    at /v1/a2a/tasks with polling and cancel, and a skill query at /v1/a2a/skills. Every MCP tool is published
    as an A2A skill on the signed agent card.
  image: https://emem.dev/logo.png
  humanURL: https://emem.dev/a2a
  baseURL: https://emem.dev/a2a/tasks
  tags:
  - A2A
  - AI Agents
  properties:
  - type: Documentation
    url: https://emem.dev/a2a
  - type: Documentation
    name: A2A async tasks extension spec
