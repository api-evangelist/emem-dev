  evidence: /.well-known/oauth-protected-resource (200) for resource https://emem.dev/mcp - auth_required false, authorization_servers [], bearer_methods_supported [], resource_signing_alg_values_supported [EdDSA].
- id: rfc7591-dynamic-client-registration
  conforms: true
