envelope:
  media_type: application/json
  shape: '{ "code": string, "message": string, "schema": "emem.error.v1", "path"?: string, "did_you_mean"?: [string],
    "details"?: object, "agent_hint"?: string, "next_steps"?: [string], "examples"?: [object] }'
  rfc9457: false
  note: 'Not application/problem+json. Refusals are written for an agent: 20 of 20 refusals in the provider''s own
    sweep named the missing field and the accepted alternatives (/v1/limits measured.surface_behaviour).'
  mcp: Over MCP the same codes surface as JSON-RPC error objects with the negative mcp_error_code below.
