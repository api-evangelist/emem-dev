source: Derived by aligning the live MCP tools/list (mcp/emem-dev-mcp-tools-list.json, 110 tools fetched 2026-09-19
  from https://emem.dev/mcp/full, 8 pages) with the operationIds in openapi/emem-dev-openapi.json (196 operations).
  The provider names its MCP tools after its REST operationIds, so most rows bind by exact name; GET/POST twins
  of one path are listed together.
purpose: Make each MCP tool a first-class discovery unit bound to the REST operation that backs it. The tool inherits
  that operation's parameters + requestBody as its real input contract; the live tools/list also carries a real
  inputSchema per tool, so both are recorded rather than guessed.
