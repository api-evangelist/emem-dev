- id: rfc8414-oauth-authorization-server-metadata
  conforms: true
  evidence: /.well-known/oauth-authorization-server (200) with issuer https://emem.dev, authorization_endpoint, token_endpoint, registration_endpoint, code_challenge_methods_supported [S256], grant_types authorization_code + refresh_token. The provider states the AS is optional and open and that a token grants nothing an anonymous caller lacks.
- id: rfc9728-oauth-protected-resource-metadata
