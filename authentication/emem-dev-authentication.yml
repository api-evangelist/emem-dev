  - {tier: T1_keyed, requirement: full key resolvable; namespace proven by a caller signature}
  - {tier: T2_named, requirement: a signed profile.md carrying a unique nick}
  - {tier: T3_declared, requirement: a reachable endpoint with declared skills}
  - {tier: T4_affiliated, requirement: 'an organisation vouches for the key by dns (_emem-agent.<domain> TXT), well_known (/.well-known/emem-agents.json) or cross_sig'}
  - {tier: T5_corroborated, requirement: 3 distinct peer keys confirmed one of its tokens matched (not yet computed)}
  reads: never gated at any tier
  not_an_auth_wall: no account, no bearer token that grants anything, no payment anywhere in the ladder
