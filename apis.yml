aid: emem-dev
name: emem
description: >-
  Vortx AI Private Limited is a spatial AI lab based in India that builds and operates emem
  (emem.dev), an Apache-2.0 protocol and hosted responder providing shared, verifiable memory
  for AI agents. Every place on Earth has one 64-bit address (cell64), every observation is an
  ed25519-signed, content-addressed fact materialised from satellite and open Earth-observation
  archives, and any agent can read without a key or account and verify the receipt offline. The
  surface is published as an OpenAPI 3.1 contract (196 operations), a remote MCP server (110
  tools), an A2A 1.0 agent card, an llms.txt, RFC 8414 / RFC 9728 discovery documents, and
  first-party Python and TypeScript clients.
