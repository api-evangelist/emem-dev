method: derived
source: Derived from openapi/emem-dev-openapi.json components.schemas (41 schemas, $ref links walked) and the token
  grammar published in https://emem.dev/llms.txt ("Token shapes") and https://emem.dev/docs/model.html.
docs: https://emem.dev/docs/model.html
notation: relationships use has_one / has_many / belongs_to with the field or token segment that carries the reference.
core_model: Cell x Band x Tslot -> Fact. A fact is signed by the responder over the blake3 of its canonical CBOR;
  nine typed token shapes share the emem:<shape>:<...> syntax and do not share one guarantee.
entities:
- name: Cell
  id_form: cell64 (b1024 base-65 string, 21-bit lat + 22-bit lng, ~9.55 m at the equator)
  token: emem:cell:<cell64>
  description: One place on Earth. An address, not a digest; nothing dereferences until a fact hangs on it.
- name: Band
  id_form: band key drawn from the bands manifest (bands_cid)
  description: A typed measurement channel (NDVI, elevation, air temperature, ...) with tempo and privacy_class;
    90 distinct bands live in the corpus at fetch time.
- name: Tslot
  id_form: time slot aligned to the band's tempo
  description: The time coordinate of a fact.
- name: Fact
  id_form: fact_cid = blake3 over canonical CBOR (32 bytes, 52 base32 chars); cid_v1 alias
  token: emem:fact:<cell64>:<fact_cid>
  description: One signed observation keyed by Cell x Band x Tslot. The only token shape where "same bytes for everyone"
    holds.
- name: Receipt
  id_form: x-emem-receipt-cid header; preimage_version v0/v1/v2
  description: ed25519 signature by the responder over a domain-separated blake3 preimage binding the request, the
    fact_cids read and (v2) the inclusion proof.
- name: Attester
  id_form: ed25519 pubkey (52-char base32); pubkey8 namespace prefix
  description: A writer. Owns /memories/by_attester/<pubkey8>/ and signs every write; tiered T0-T5 by the enlistment
    ladder.
- name: MemoryFile
  id_form: /memories/<path> plus file_cid
  description: A prose note written by an agent (kinds episodic | semantic | procedural | resource | vault). World-readable
    unless vault; deletion unpublishes, content remains.
- name: Entity
  id_form: entity_cid (16-byte truncated hash of identity anchor)
  token: emem:entity:<entity_cid>
  description: One canonical object identity (a farm plot, a bridge) that agents co-refer to; may carry external
    ids (GERS / OSM / Wikidata) via entity_link.
- name: Bundle
  id_form: bundle_cid (16-byte hash over the citation list)
  token: emem:bundle:<bundle_cid>
  description: A signed set of 2..256 facts.
- name: Raster
  token: emem:raster:<aoi_cid>:<band>:<tslot>:<derivation_cid>
  description: A native-resolution Sentinel-2 field over a bbox as a signed derivation.
- name: Cube
  token: emem:cube:<aoi_cid>:<band>:<tslot_lo>..<tslot_hi>:<derivation_cid>
  description: 'A field over time: a manifest over raster slices.'
- name: RasterSet
  token: emem:rasterset:<bundle_cid>:<derivation_cid>
  description: 2..64 field tokens bound into one citeable manifest.
- name: Derivation
  id_form: derivation registered under an attester key
  description: A value an agent computed from facts, registered via /v1/derive and recomputable by the responder.
- name: Trace
  token: emem:trace:...
  description: One verified OS execution trace (emem.os_trace.v1) showing how a device ran when it produced a reading.
- name: Attestation
  token: emem:attestation:...
  description: 'A device''s platform evidence: which hardware root of trust (IETF RATS) vouched for its key.'
- name: LogEntry
  id_form: leaf index in the RFC 6962-style transparency log (tree_size, root_b32)
  description: Append-only record of writes and verdicts; inclusion and consistency proofs at /v1/log/*.
- name: A2ATask
  id_form: task id from POST /v1/a2a/tasks
  description: An asynchronous A2A task with poll (GET /v1/a2a/tasks/{id}) and cancel (POST /v1/a2a/tasks/{id}/cancel).
